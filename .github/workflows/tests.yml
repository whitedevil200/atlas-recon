name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile atlas.py availability.py
      - name: Bash syntax and menu smoke check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n atlas install.sh
          printf '0\n' | bash atlas
          bash atlas --version
      - name: Windows launcher smoke check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\atlas.cmd --version
          '0' | .\atlas.cmd

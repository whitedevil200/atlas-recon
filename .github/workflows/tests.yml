name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-runtime.lock
      - name: Complete manual coverage and synchronized copies
        run: python scripts/build-man.py --check
      - name: Render Linux man page and reject roff warnings
        if: runner.os == 'Linux' && matrix.python == '3.13'
        shell: bash
        run: |
          if ! command -v groff >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y groff-base
          fi
          groff -Tutf8 -man -ww man/atlas.1 > /tmp/atlas-man.txt 2> /tmp/atlas-man-warnings.txt
          cat /tmp/atlas-man-warnings.txt
          test ! -s /tmp/atlas-man-warnings.txt
          test -s /tmp/atlas-man.txt
      - run: python -m unittest discover -s tests -v
      - name: Install and verify free engines (no target scans)
        if: matrix.python == '3.13'
        run: |
          python atlas.py setup-engines
          python scripts/check-engines.py
      - name: Controlled loopback DNS lab
        run: python scripts/benchmark-lab.py --output lab-benchmark.json
      - run: python -m py_compile atlas.py availability.py lookups.py dns_evidence.py inventory.py integrations.py workflows.py run_state.py
      - name: Installed wheel and bundled-resource smoke check
        run: python scripts/check-wheel.py
      - name: Bash syntax and menu smoke check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n atlas install.sh
          printf '0\n' | bash atlas
          bash atlas --version
          ATLAS_SKIP_ENGINES=1 bash install.sh
          "$HOME/.local/bin/atlas" lookup --help
          printf 'api.example.com\n' > /tmp/atlas-ci-names.txt
          python atlas.py scan -d example.com --offline --import /tmp/atlas-ci-names.txt
          printf '\n' | python atlas.py scan -d example.com --offline --import /tmp/atlas-ci-names.txt --lookup -o /tmp/atlas-ci-lookup
          atlas_run_directory=(results/example.com-*)
          printf '10\n%s\nq\n\n0\n' "${atlas_run_directory[0]}" | bash atlas
          bash atlas health "${atlas_run_directory[0]}"
          bash atlas evidence "${atlas_run_directory[0]}" --serial 1
          bash atlas resume "${atlas_run_directory[0]}" --no-lookup
          bash scripts/install-engines.sh --list
      - name: Windows launcher smoke check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\atlas.cmd --version
          '0' | .\atlas.cmd

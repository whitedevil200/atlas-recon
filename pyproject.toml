[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-recon"
version = "2.1.1"
description = "Colorful CLI reconnaissance with subdomain discovery and persistent evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ATLAS Recon contributors"}]
keywords = ["subdomain", "reconnaissance", "dns", "osint", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
]
dependencies = ["dnspython==2.8.0", "ipwhois==1.3.0", "tldextract==5.4.0"]

[project.optional-dependencies]
terminal = ["rich==14.1.0"]

[project.scripts]
atlas = "atlas:main"

[project.urls]
Homepage = "https://github.com/whitedevil200/atlas-recon"
Issues = "https://github.com/whitedevil200/atlas-recon/issues"
Source = "https://github.com/whitedevil200/atlas-recon"

[tool.setuptools]
py-modules = ["atlas", "availability", "lookups", "dns_evidence", "inventory", "integrations", "workflows", "run_state", "engine_bundle"]
packages = ["atlas_data"]
include-package-data = true

[tool.setuptools.package-data]
atlas_data = ["starter.txt", "atlas.1", "engines.lock.json", "findomain-LICENSE.txt"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/atlas.1"]
